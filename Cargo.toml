[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
homepage   = "https://github.com/kjanat/actup-v2#readme"
repository = "https://github.com/kjanat/actup-v2"
license    = "MIT OR Apache-2.0"
keywords   = ["cli", "github-actions", "lsp", "version"]
categories = ["command-line-utilities", "development-tools"]
publish    = true

[workspace.dependencies]
actup-core            = { path = "crates/core", version = "*" }
actup-provider-github = { path = "crates/provider-github", version = "*" }
base64                = "0.22"                                              # encoding
clap_complete         = "4.5"                                               # completions
console               = "0.16"                                              # terminal
dashmap               = "6"                                                 # concurrency
directories           = "6"                                                 # paths
dirs                  = "6"                                                 # paths
futures               = "0.3"                                               # async
glob                  = "0.3"                                               # patterns
human-panic           = "2"                                                 # panics
indicatif             = "0.18"                                              # progress
insta                 = { version = "1.42", features = ["yaml"] }           # snapshots
json_comments         = "0.2"                                               # jsonc
miette                = { version = "7.6", features = ["fancy"] }           # errors
node-semver           = "2"                                                 # semver
octocrab              = "0.49"                                              # github
owo-colors            = "4"                                                 # colors
rust-mcp-sdk          = "0.8"                                               # mcp
sanitize-filename     = "0.6"                                               # filesystem
schemars              = "1"                                                 # schema
schemars_derive       = "1"                                                 # schema
semver                = "1"                                                 # semver
serde                 = { version = "1", features = ["derive"] }            # serialization
serde_json            = "1"                                                 # json
serde_yaml_ng         = "0.10"                                              # yaml
tempfile              = "3"                                                 # testing
thiserror             = "2"                                                 # errors
tokio                 = { version = "1", features = ["full"] }              # async
toml                  = "0.9"                                               # config
tower-lsp-server      = "0.23"                                              # lsp
tracing               = "0.1"                                               # logging
tracing-subscriber    = { version = "0.3", features = ["env-filter"] }      # logging
url                   = "2"                                                 # urls
walkdir               = "2"                                                 # filesystem
wiremock              = "0.6"                                               # mocking

[workspace.dependencies.clap]  # CLI
version  = "4.5"
features = ["deprecated", "derive", "env", "unicode", "wrap_help"]

[workspace.dependencies.figment]  # Configuration
version  = "0.10"
features = ["env", "json", "toml", "yaml"]

[workspace.dependencies.reqwest]  # HTTP/API
version          = "0.13"
default-features = false
features         = ["json", "rustls"]

[workspace.lints.clippy]
all                                = { level = "warn", priority = -1 }
expect_used                        = "deny"
identity_op                        = "deny"
manual_clamp                       = "deny"
manual_filter                      = "deny"
manual_find                        = "deny"
manual_flatten                     = "deny"
manual_map                         = "deny"
manual_memcpy                      = "deny"
manual_non_exhaustive              = "deny"
manual_ok_or                       = "deny"
manual_range_contains              = "deny"
manual_retain                      = "deny"
manual_strip                       = "deny"
manual_try_fold                    = "deny"
manual_unwrap_or                   = "deny"
module_name_repetitions            = "allow"
must_use_candidate                 = "allow"
needless_borrow                    = "deny"
needless_borrowed_reference        = "deny"
needless_collect                   = "deny"
needless_late_init                 = "deny"
needless_option_as_deref           = "deny"
needless_question_mark             = "deny"
needless_update                    = "deny"
nursery                            = { level = "warn", priority = -1 }
pedantic                           = { level = "warn", priority = -1 }
redundant_clone                    = "deny"
redundant_closure                  = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes         = "deny"
trivially_copy_pass_by_ref         = "deny"
uninlined_format_args              = "deny"
unnecessary_filter_map             = "deny"
unnecessary_lazy_evaluations       = "deny"
unnecessary_sort_by                = "deny"
unnecessary_to_owned               = "deny"
unwrap_used                        = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.rustdoc]
bare_urls                    = "deny"
broken_intra_doc_links       = "deny"
invalid_codeblock_attributes = "warn"
invalid_html_tags            = "deny"
invalid_rust_codeblocks      = "deny"
missing_crate_level_docs     = "forbid"
private_doc_tests            = "warn"
private_intra_doc_links      = "warn"
redundant_explicit_links     = "deny"
unescaped_backticks          = "warn"

[profile.ci-test]
inherits  = "test"
opt-level = 0
debug     = 1
