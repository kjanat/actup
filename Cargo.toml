[workspace]
resolver        = "3"
members         = ["crates/*", "extensions/*", "languages/*"]
exclude         = ["extensions/vscode", "languages/node_modules"]
# actup-wasm and zed-actup are wasm32-only; exclude from default native builds
default-members = [
  "crates/actup",
  "crates/core",
  "crates/lsp",
  "crates/mcp",
  "crates/provider-gitea",
  "crates/provider-github",
  "crates/provider-gitlab",
  "crates/providers",
  "crates/test-support",
  "extensions/zed",
  "languages/tree-sitter-github-actions",
]

[workspace.package]
version      = "0.1.0"
authors      = ["Kaj Kowalski <info@kajkowalski.nl>"]
edition      = "2024"
rust-version = "1.96"
homepage     = "https://github.com/kjanat/actup-v2#readme"
repository   = "https://github.com/kjanat/actup-v2"
license      = "MIT OR Apache-2.0"
keywords     = ["cli", "github-actions", "lsp", "version"]
categories   = ["command-line-utilities", "development-tools"]
publish      = true

[workspace.dependencies]
actup-core            = { path = "crates/core", version = "0.1.0" }
actup-provider-gitea  = { path = "crates/provider-gitea", version = "0.1.0" }
actup-provider-github = { path = "crates/provider-github", version = "0.1.0" }
actup-provider-gitlab = { path = "crates/provider-gitlab", version = "0.1.0" }
actup-providers       = { path = "crates/providers", version = "0.1.0" }
anstream              = "1"  # colour-aware streams
async-trait           = "0.1"  # async trait impls
base64                = "0.22"  # encoding
bstr                  = "1"  # byte strings (git refs)
cc                    = "1.2"
clap_complete         = "4.5"  # completions
dashmap               = "6"  # concurrency
dirs                  = "6"  # paths
futures               = "0.3"  # async
glob                  = "0.3"  # patterns
indicatif             = "0.18"  # progress
itertools             = "0.14"  # iterator utilities
js-sys                = "0.3.95"  # wasm js interop
json_comments         = "0.2"  # jsonc
owo-colors            = "4"  # colors
rust-mcp-sdk          = "0.9"  # mcp
saphyr-parser         = "0.0.6"  # yaml
schemars              = "1"  # schema
serde_json            = "1"  # json
serde-wasm-bindgen    = "0.6"  # wasm serde bridge
strsim                = "0.11"  # did-you-mean hints, closest-tag suggestions
tempfile              = "3"  # testing
thiserror             = "2"  # error derive
toml                  = "1"  # config
tower                 = "0.5"  # service
tower-lsp-server      = "0.23"  # lsp
tracing               = "0.1"  # logging
tree-sitter           = "0.26.8"
tree-sitter-language  = "0.1"
tsify                 = "0.5.8"  # rust→ts type emission for wasm-bindgen
wasm-bindgen          = "0.2.118"  # wasm bindings
wasm-bindgen-futures  = "0.4.68"  # async wasm-bindgen exports
wiremock              = "0.6"  # mocking
zed_extension_api     = "0.7.0"  # zed extension

[workspace.dependencies.clap]  # CLI
version  = "4.5"
features = ["derive", "env", "wrap_help"]

[workspace.dependencies.figment]  # Configuration
version  = "0.10"
features = ["env", "json", "toml"]

[workspace.dependencies.gix-features]  # git progress traits
version  = "0.48"
features = ["progress"]

[workspace.dependencies.gix-protocol]  # git wire protocol (ls-refs)
version          = "0.63"
default-features = false
features         = ["blocking-client", "sha1"]

[workspace.dependencies.gix-transport]  # git transport (https)
version          = "0.57"
default-features = false
features         = ["blocking-client", "http-client-reqwest-rust-tls"]

[workspace.dependencies.pulldown-cmark]  # markdown (testing)
version          = "0.13.4"
default-features = false

[workspace.dependencies.reqwest]  # HTTP/API
version          = "0.13"
default-features = false
features         = ["json", "rustls"]

[workspace.dependencies.serde]  # serialization
version  = "1"
features = ["derive", "rc"]

[workspace.dependencies.tokio]  # async runtime
version  = "1"
features = ["full"]

[workspace.dependencies.tracing-subscriber]  # logging
version  = "0.3"
features = ["env-filter"]

[workspace.lints.clippy]
expect_used                        = "deny"
identity_op                        = "deny"
manual_clamp                       = "deny"
manual_filter                      = "deny"
manual_find                        = "deny"
manual_flatten                     = "deny"
manual_map                         = "deny"
manual_memcpy                      = "deny"
manual_non_exhaustive              = "deny"
manual_ok_or                       = "deny"
manual_range_contains              = "deny"
manual_retain                      = "deny"
manual_strip                       = "deny"
manual_try_fold                    = "deny"
manual_unwrap_or                   = "deny"
module_name_repetitions            = "warn"
must_use_candidate                 = "deny"
needless_borrow                    = "deny"
needless_borrowed_reference        = "deny"
needless_collect                   = "deny"
needless_late_init                 = "deny"
needless_option_as_deref           = "deny"
needless_question_mark             = "deny"
needless_update                    = "deny"
redundant_clone                    = "deny"
redundant_closure                  = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes         = "deny"
trivially_copy_pass_by_ref         = "deny"
uninlined_format_args              = "deny"
unnecessary_filter_map             = "deny"
unnecessary_lazy_evaluations       = "deny"
unnecessary_sort_by                = "deny"
unnecessary_to_owned               = "deny"
unwrap_used                        = "deny"

[workspace.lints.clippy.all]
level    = "warn"
priority = -1

[workspace.lints.clippy.nursery]
level    = "warn"
priority = -1

[workspace.lints.clippy.pedantic]
level    = "warn"
priority = -1

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code  = "forbid"

[workspace.lints.rustdoc]
bare_urls                    = "deny"
broken_intra_doc_links       = "deny"
invalid_codeblock_attributes = "warn"
invalid_html_tags            = "deny"
invalid_rust_codeblocks      = "deny"
missing_crate_level_docs     = "forbid"
private_doc_tests            = "warn"
private_intra_doc_links      = "warn"
redundant_explicit_links     = "deny"
unescaped_backticks          = "warn"

[profile.ci-test]
inherits  = "test"
opt-level = 0
debug     = 1
