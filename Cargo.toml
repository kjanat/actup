[workspace]
resolver        = "3"
members         = ["crates/*", "extensions/*", "languages/*"]
exclude         = ["extensions/vscode", "languages/node_modules"]
# actup-wasm and zed-actup are wasm32-only; exclude from default native builds
default-members = [
  "crates/actup",
  "crates/core",
  "crates/lsp",
  "crates/mcp",
  "crates/provider-gitea",
  "crates/provider-github",
  "crates/provider-gitlab",
  "crates/providers",
  "extensions/zed",
  "languages/tree-sitter-github-actions",
]

[workspace.package]
version      = "0.1.0"
authors      = ["Kaj Kowalski <info@kajkowalski.nl>"]
edition      = "2024"
rust-version = "1.96"
homepage     = "https://github.com/kjanat/actup-v2#readme"
repository   = "https://github.com/kjanat/actup-v2"
license      = "MIT OR Apache-2.0"
keywords     = ["cli", "github-actions", "lsp", "version"]
categories   = ["command-line-utilities", "development-tools"]
publish      = true

[workspace.dependencies]
actup-core.path            = "crates/core"
actup-provider-github.path = "crates/provider-github"
actup-providers.path       = "crates/providers"
async-trait                = "0.1"  # async trait impls
base64                     = "0.22"  # encoding
bstr                       = "1"  # byte strings (git refs)
cc                         = "1.2"
clap_complete              = "4.5"  # completions
dashmap                    = "6"  # concurrency
directories                = "6"  # paths
dirs                       = "6"  # paths
futures                    = "0.3"  # async
glob                       = "0.3"  # patterns
human-panic                = "2"  # panics
itertools                  = "0.14"  # iterator utilities
js-sys                     = "0.3.95"  # wasm js interop
json_comments              = "0.2"  # jsonc
octocrab                   = "0.49"  # github
owo-colors                 = "4"  # colors
rust-mcp-sdk               = "0.9"  # mcp
sanitize-filename          = "0.6"  # filesystem
saphyr-parser              = "0.0.6"  # yaml
schemars                   = "1"  # schema
schemars_derive            = "1"  # schema
serde_json                 = "1"  # json
serde-wasm-bindgen         = "0.6"  # wasm serde bridge
serde_yaml_ng              = "0.10"  # yaml
tempfile                   = "3"  # testing
toml                       = "1"  # config
tower                      = "0.5"  # service
tower-lsp-server           = "0.23"  # lsp
tracing                    = "0.1"  # logging
tree-sitter                = "0.26.8"
tree-sitter-language       = "0.1"
tsify-next                 = "0.5"  # rust→ts type emission for wasm-bindgen
url                        = "2"  # urls
urlencoding                = "2.1"  # url encoding
walkdir                    = "2"  # filesystem
wasm-bindgen               = "0.2.118"  # wasm bindings
wasm-bindgen-futures       = "0.4.68"  # async wasm-bindgen exports
wasm-bindgen-test          = "0.3.68"  # wasm test harness
wiremock                   = "0.6"  # mocking
zed_extension_api          = "0.7.0"  # zed extension

[workspace.dependencies.clap]  # CLI
version  = "4.5"
features = ["derive", "env", "wrap_help"]

[workspace.dependencies.figment]  # Configuration
version  = "0.10"
features = ["env", "json", "toml", "yaml"]

[workspace.dependencies.gix-features]  # git progress traits
version  = "0.48"
features = ["progress"]

[workspace.dependencies.gix-protocol]  # git wire protocol (ls-refs)
version          = "0.63"
default-features = false
features         = ["blocking-client", "sha1"]

[workspace.dependencies.gix-transport]  # git transport (https)
version          = "0.57"
default-features = false
features         = ["blocking-client", "http-client-reqwest-rust-tls"]

[workspace.dependencies.insta]  # snapshots
version  = "1.42"
features = ["yaml"]

[workspace.dependencies.miette]  # errors
version  = "7.6"
features = ["fancy"]

[workspace.dependencies.reqwest]  # HTTP/API
version          = "0.13"
default-features = false
features         = ["json", "rustls"]

[workspace.dependencies.serde]  # serialization
version  = "1"
features = ["derive", "rc"]

[workspace.dependencies.tokio]  # async runtime
version  = "1"
features = ["full"]

[workspace.dependencies.tracing-subscriber]  # logging
version  = "0.3"
features = ["env-filter"]

[workspace.lints.clippy]
expect_used                        = "deny"
identity_op                        = "deny"
manual_clamp                       = "deny"
manual_filter                      = "deny"
manual_find                        = "deny"
manual_flatten                     = "deny"
manual_map                         = "deny"
manual_memcpy                      = "deny"
manual_non_exhaustive              = "deny"
manual_ok_or                       = "deny"
manual_range_contains              = "deny"
manual_retain                      = "deny"
manual_strip                       = "deny"
manual_try_fold                    = "deny"
manual_unwrap_or                   = "deny"
module_name_repetitions            = "warn"
must_use_candidate                 = "deny"
needless_borrow                    = "deny"
needless_borrowed_reference        = "deny"
needless_collect                   = "deny"
needless_late_init                 = "deny"
needless_option_as_deref           = "deny"
needless_question_mark             = "deny"
needless_update                    = "deny"
redundant_clone                    = "deny"
redundant_closure                  = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes         = "deny"
trivially_copy_pass_by_ref         = "deny"
uninlined_format_args              = "deny"
unnecessary_filter_map             = "deny"
unnecessary_lazy_evaluations       = "deny"
unnecessary_sort_by                = "deny"
unnecessary_to_owned               = "deny"
unwrap_used                        = "deny"

[workspace.lints.clippy.all]
level    = "warn"
priority = -1

[workspace.lints.clippy.nursery]
level    = "warn"
priority = -1

[workspace.lints.clippy.pedantic]
level    = "warn"
priority = -1

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code  = "forbid"

[workspace.lints.rustdoc]
bare_urls                    = "deny"
broken_intra_doc_links       = "deny"
invalid_codeblock_attributes = "warn"
invalid_html_tags            = "deny"
invalid_rust_codeblocks      = "deny"
missing_crate_level_docs     = "forbid"
private_doc_tests            = "warn"
private_intra_doc_links      = "warn"
redundant_explicit_links     = "deny"
unescaped_backticks          = "warn"

[profile.ci-test]
inherits  = "test"
opt-level = 0
debug     = 1
