# rust-analyzer.toml — project-root config for rust-analyzer.
# Docs: https://rust-analyzer.github.io/book/configuration.html
#
# The workspace mixes native crates (default-members) with wasm32-only
# crates (actup-wasm, extensions/zed). Without this config, rust-analyzer
# warns "this file is not included in any crates" on wasm sources because
# it only analyzes the host target by default.
#
# ⚠️ Analysis vs. check split:
#   - `[cargo] target` drives IDE analysis (hover, goto-def, cfg highlighting).
#     Only one target at a time; the other target's cfg branches appear inactive.
#   - `[check] targets` drives the red-squiggle pass. Multiple targets run in
#     sequence and diagnostics merge.
# Default below: analyze native, check both. If you're actively editing
# `crates/wasm/` or `extensions/zed/` and want wasm cfg branches live in RA
# (instead of grayed out), uncomment the [cargo] block below and reload RA.

# [cargo]
# target = "wasm32-unknown-unknown"

[check]
# Use clippy for inline diagnostics — matches `just lint` and CI.
command    = "clippy"
# Enable --all-targets so tests, examples, and benches get diagnostics too.
allTargets = true
# Run cargo check for BOTH native and wasm32, merging diagnostics. This is
# what makes wasm-only crates surface errors/warnings in the editor.
#
# Platform note: the first entry is Linux x86_64. Override locally on other hosts:
#   macOS Intel       -> "x86_64-apple-darwin"
#   macOS Apple Si.   -> "aarch64-apple-darwin"
#   Windows MSVC      -> "x86_64-pc-windows-msvc"
targets    = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
