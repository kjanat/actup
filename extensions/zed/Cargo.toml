[package]
name    = "zed-actup"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib"]
path       = "src/lib.rs"

[dependencies]
zed_extension_api = "0.7.0"

[lints.clippy]
expect_used             = "deny"
module_name_repetitions = { level = "allow", priority = 1 }
unwrap_used             = "deny"

[lints.clippy.all]
level    = "warn"
priority = -1

[lints.clippy.pedantic]
level    = "warn"
priority = -1

[lints.rust]
unsafe_code = "forbid"

[lints.rustdoc]
missing_crate_level_docs = "forbid"
