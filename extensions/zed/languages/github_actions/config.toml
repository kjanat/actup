#:schema https://github.com/kjanat/zed-editor/raw/feature/extension-toml-schema/crates/extension_api/schemas/language-config.schema.json

name                                  = "GitHub Actions"
grammar                               = "github_actions"
line_comments                         = ["# "]
autoclose_before                      = ",]}"
brackets                              = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "\"", end = "\"", close = true, surround = true, newline = false },
  { start = "'", end = "'", close = true, surround = true, newline = false },
]
auto_indent_on_paste                  = false
auto_indent_using_last_non_empty_line = false
increase_indent_pattern               = ":\\s*[|>]?\\s*$"
tab_size                              = 2
hard_tabs                             = false
linked_edit_characters                = ["-", ":", "{", "}", "[", "]", "\"", "'"]
scope_opt_in_language_servers         = ["actup-lsp", "actions-languageserver", "yaml-language-server"]
