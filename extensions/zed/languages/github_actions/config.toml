#:schema https://github.com/kjanat/zed-editor/raw/refs/heads/feature/extension-toml-schema/crates/extension_api/schemas/language-config.schema.json

name                                  = "GitHub Actions"
grammar                               = "yaml"
line_comments                         = ["# "]
autoclose_before                      = ",]}"
brackets                              = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
]
auto_indent_on_paste                  = false
auto_indent_using_last_non_empty_line = false
increase_indent_pattern               = ":\\s*[|>]?\\s*$"
prettier_parser_name                  = "yaml"
tab_size                              = 2
hard_tabs                             = false
