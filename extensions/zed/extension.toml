#:schema https://github.com/kjanat/zed-editor/raw/refs/heads/feature/extension-toml-schema/crates/extension_api/schemas/extension.schema.json

name           = "actup — Actions Updater"
id             = "actup"
schema_version = 1
version        = "0.1.0"
description    = "Keep GitHub Actions up-to-date — diagnostics, code actions, hover, completion"
authors        = ["Kaj Kowalski <info@kajkowalski.nl>"]
repository     = "https://github.com/kjanat/actup-v2"

[language_servers.actup-lsp]
languages = ["GitHub Actions", "YAML"]

[language_servers.actup-lsp.language_ids]
"GitHub Actions" = "github_actions"
"YAML"           = "github_actions"

# [language_servers.actions-languageserver]
# languages = ["GitHub Actions", "YAML"]

# [language_servers.actions-languageserver.language_ids]
# "GitHub Actions" = "github_actions"
# "YAML"           = "github_actions"

[[capabilities]]  # TODO: when not dev, and pre-pr to zed-extensions repo, rm this block.
kind    = "process:exec"
command = "*"
args    = ["**"]

[[capabilities]]
kind    = "npm:install"
package = "@actions/languageserver"

# Reserved for future use; not currently published as an npm package
# [[capabilities]]
# kind    = "npm:install"
# package = "actup-lsp"

[grammars.github_actions]
repository = "file:///home/kjanat/projects/actup-v2"
rev        = "tree-sitter-github-actions"
path       = "languages/tree-sitter-github-actions"
