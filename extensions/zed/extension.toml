#:schema https://github.com/kjanat/zed-editor/raw/refs/heads/feature/extension-toml-schema/crates/extension_api/schemas/extension.schema.json

name           = "actup — Actions Updater"
id             = "actup"
schema_version = 1
version        = "0.1.0"
description    = "Keep GitHub Actions up-to-date — diagnostics, code actions, hover, completion"
authors        = ["Kaj Kowalski <info@kajkowalski.nl>"]
repository     = "https://github.com/kjanat/actup-v2"

[language_servers.actup-lsp]
languages = ["GitHub Actions", "YAML"]

[language_servers.actup-lsp.language_ids]
"GitHub Actions" = "yaml"
"YAML"           = "yaml"

[language_servers.yaml-language-server]
languages = ["GitHub Actions"]

[language_servers.yaml-language-server.language_ids]
"GitHub Actions" = "yaml"

[[capabilities]]
kind    = "process:exec"
command = "actup-lsp"
args    = []

[[capabilities]]
kind    = "process:exec"
command = "yaml-language-server"
args    = ["--stdio"]

[grammars.yaml]
repository = "https://github.com/zed-industries/tree-sitter-yaml"
rev        = "baff0b51c64ef6a1fb1f8390f3ad6015b83ec13a"

[grammars.gh_actions_expressions]
repository = "https://github.com/hdoc1509/tree-sitter-gh-actions-expressions"
rev        = "823a5876dcf3a1f5aa8cf9df2ac69eea6e8d7068"                        # v0.5.1

# [context_servers.actup-mcp]

[slash_commands."actions:update"]
description       = "Update GitHub Actions uses: refs to the latest version"
requires_argument = false
