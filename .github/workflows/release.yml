name: Release

on:
  push: { tags: ["v*"] }

permissions: { contents: write }

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        cross: [false]
        archive: [tar.gz]
        include:
          # Linux
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true }
          # macOS
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Windows
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, archive: zip }

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p actup-cli

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }} -p actup-cli

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp "target/${TARGET}/release/actup" dist/
          cp README.md LICENSE dist/
          cd dist
          tar -czvf "../actup-${REF_NAME}-${TARGET}.tar.gz" ./*

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${env:TARGET}/release/actup.exe" -Destination dist/
          Copy-Item README.md, LICENSE -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath "actup-${env:REF_NAME}-${env:TARGET}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: actup-${{ matrix.target }}
          path: actup-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  checksums:
    name: Generate checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum actup-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v6
        with:
          name: checksums
          path: artifacts/SHA256SUMS.txt

  release:
    name: Create Release
    needs: [
      build,
      checksums,
    ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    # Skip if repo is private (secrets can't be checked at job level)
    if: ${{ !github.event.repository.private }}
    env:
      # Job-level env so `if:` expressions can check token presence
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        env: { CARGO_REGISTRY_TOKEN: "" } # not needed for checkout

      - uses: dtolnay/rust-toolchain@stable
        env: { CARGO_REGISTRY_TOKEN: "" } # not needed for toolchain setup

      - name: Publish crates
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        # Cargo 1.90+ handles dependency ordering; exclude stubs with publish=false
        run: cargo publish --workspace --exclude actup-lsp --exclude actup-mcp
