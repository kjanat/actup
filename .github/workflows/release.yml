name: Release
on: { push: { tags: ["v*"] } }
concurrency: { group: release, cancel-in-progress: false }
permissions: { contents: write }
env: { CARGO_TERM_COLOR: always }
jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        cross: [false]
        archive: [.tar.gz]
        package: [actup]
        ext: [""]
        include:
          # Linux
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true }
          # macOS
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Windows
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: .zip, ext: .exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, archive: .zip, ext: .exe }

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target "${{ matrix.target }}" -p "${{ matrix.package }}"

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target "${{ matrix.target }}" -p "${{ matrix.package }}"

      - name: Package
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          PACKAGE: ${{ matrix.package }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir -p dist
          cp "target/${TARGET}/release/${PACKAGE}${EXT}" dist/
          cp README.md LICENSE dist/
          if [[ "${ARCHIVE}" == ".zip" ]]; then
            cd dist && 7z a "../${PACKAGE}-${REF_NAME}-${TARGET}${ARCHIVE}" ./*
          else
            tar -czvf "${PACKAGE}-${REF_NAME}-${TARGET}${ARCHIVE}" -C dist .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-${{ matrix.target }}
          path: ${{ matrix.package }}-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  checksums:
    name: Generate checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum actup-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: artifacts/SHA256SUMS.txt

  release:
    name: Create Release
    needs: [build, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with: { path: artifacts, merge-multiple: true }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.private }}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        env: { CARGO_REGISTRY_TOKEN: "" }

      - uses: dtolnay/rust-toolchain@stable
        env: { CARGO_REGISTRY_TOKEN: "" }

      - name: Publish crates
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: cargo publish --workspace # https://doc.rust-lang.org/cargo/CHANGELOG.html#cargo-190-2025-09-18

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install deps
        working-directory: packages/actup-wasm
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: packages/actup-wasm
        run: bun run build
      - name: Verify tarball
        working-directory: packages/actup-wasm
        run: |
          npm pack --dry-run
          test -f dist/index.js
          test -f dist/provider.js
          test -f wasm/actup_wasm_bg.wasm
      - name: Smoke test
        working-directory: packages/actup-wasm
        run: node tests/node_import.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        working-directory: packages/actup-wasm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
