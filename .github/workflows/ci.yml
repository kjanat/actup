name: CI
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".opencode/**"
      - ".zed/**"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".opencode/**"
      - ".zed/**"
      - ".claude/**"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all -- --check
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
  test:
    name: Test
    runs-on: ubuntu-latest
    env: { CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}" }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features --profile ci
      - run: cargo nextest run --workspace --no-default-features --profile ci
      - run: cargo test --doc --workspace --all-features
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: target/nextest/ci/junit.xml
          report_type: test_results
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}

  test-platforms:
    name: Test (${{ matrix.os }})
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [macos-latest, windows-latest] }
    env: { CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}" }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features --profile ci
      - run: cargo nextest run --workspace --no-default-features --profile ci
      - run: cargo test --doc --workspace --all-features
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: target/nextest/ci/junit.xml
          report_type: test_results
          fail_ci_if_error: false
          flags: ${{ matrix.os }}
          token: ${{ env.CODECOV_TOKEN }}
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_MSRV == 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env: { CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}" }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ env.CODECOV_TOKEN }}

  check-extensions:
    name: Extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy
      - uses: oven-sh/setup-bun@v2
      - name: Zed — clippy
        working-directory: extensions/zed
        run: cargo clippy --target wasm32-wasip2 -- -D warnings
      - name: VSCode — install
        working-directory: extensions/vscode
        run: bun install --frozen-lockfile
      - name: VSCode — lint + typecheck
        working-directory: extensions/vscode
        run: bun run lint && bun run typecheck

  # Final status check for branch protection
  ci-success:
    name: CI Success
    if: always()
    needs: [fmt, clippy, test, test-platforms, doc, deny, coverage, check-extensions]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          # test-platforms may be skipped on PRs without ci:full label
          if [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.test-platforms.result }}" == "failure" ]] || \
             [[ "${{ needs.doc.result }}" != "success" ]] || \
             [[ "${{ needs.deny.result }}" != "success" ]] || \
             [[ "${{ needs.coverage.result }}" != "success" ]] || \
             [[ "${{ needs.check-extensions.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed"
