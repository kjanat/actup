name: CI
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".opencode/**"
      - ".zed/**"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".opencode/**"
      - ".zed/**"
      - ".claude/**"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
  test:
    name: Test
    runs-on: ubuntu-latest
    env: { CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}" }
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features --profile ci
      - run: cargo nextest run --workspace --no-default-features --profile ci
      - run: cargo test --doc --workspace --all-features
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: target/nextest/ci/junit.xml
          report_type: test_results
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}

  test-platforms:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && '["macos-latest", "windows-latest"]' || '["windows-latest"]') }}
    env: { CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}" }
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features --profile ci
      - run: cargo nextest run --workspace --no-default-features --profile ci
      - run: cargo test --doc --workspace --all-features
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: target/nextest/ci/junit.xml
          report_type: test_results
          fail_ci_if_error: false
          flags: ${{ matrix.os }}
          token: ${{ env.CODECOV_TOKEN }}
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps
  shear:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cargo-shear
      - run: cargo shear
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - id: msrv
        shell: bash
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          version=$(jq -r '[.packages[].rust_version] | unique | if length == 1 and .[0] != null then .[0] else error("crates disagree on rust-version: \(.)") end' <<< "${metadata}")
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - run: rustup toolchain install "${MSRV}" --profile minimal
        env: { MSRV: "${{ steps.msrv.outputs.version }}" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo "+${MSRV}" check --workspace --all-targets --all-features
        env: { MSRV: "${{ steps.msrv.outputs.version }}" }
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env: { CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}" }
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ env.CODECOV_TOKEN }}

  check-extensions:
    name: Extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - name: Zed — clippy
        working-directory: extensions/zed
        run: cargo clippy --target wasm32-wasip2 -- -D warnings
      - name: actup-wasm — install
        working-directory: packages/actup-wasm
        run: bun install --frozen-lockfile
      - name: actup-wasm — build (regenerates tsify-derived `.d.ts` from current Rust)
        working-directory: packages/actup-wasm
        run: bun run build
      - name: VSCode — install
        working-directory: extensions/vscode
        run: bun install --frozen-lockfile
      - name: VSCode — lint + typecheck (against fresh wasm types)
        working-directory: extensions/vscode
        run: bun run lint && bun run typecheck
      - name: VSCode — test
        working-directory: extensions/vscode
        run: bun run test

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (wasm32)
        run: cargo clippy -p actup-wasm --target wasm32-unknown-unknown -- -D warnings
      - uses: oven-sh/setup-bun@v2
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - name: Install npm deps
        working-directory: packages/actup-wasm
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: packages/actup-wasm
        run: bun run build
      - name: Typecheck
        working-directory: packages/actup-wasm
        run: bun run typecheck
      - name: Test
        working-directory: packages/actup-wasm
        run: bun run test
      - uses: extractions/setup-just@v4
      - name: Crate node tests
        run: just wasm-node-test

  action:
    name: Action scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck action/*.sh
      - run: action/test.sh

  # Final status check for branch protection
  ci-success:
    name: CI Success
    if: always()
    needs: [fmt, clippy, test, test-platforms, doc, shear, deny, msrv, coverage, check-extensions, wasm, action]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        env:
          FMT: ${{ needs.fmt.result }}
          CLIPPY: ${{ needs.clippy.result }}
          TEST: ${{ needs.test.result }}
          TEST_PLATFORMS: ${{ needs.test-platforms.result }}
          DOC: ${{ needs.doc.result }}
          SHEAR: ${{ needs.shear.result }}
          DENY: ${{ needs.deny.result }}
          MSRV: ${{ needs.msrv.result }}
          COVERAGE: ${{ needs.coverage.result }}
          CHECK_EXTENSIONS: ${{ needs.check-extensions.result }}
          WASM: ${{ needs.wasm.result }}
          ACTION: ${{ needs.action.result }}
        run: |
          if [[ "${FMT}" != "success" ]] || \
             [[ "${CLIPPY}" != "success" ]] || \
             [[ "${TEST}" != "success" ]] || \
             [[ "${TEST_PLATFORMS}" != "success" ]] || \
             [[ "${DOC}" != "success" ]] || \
             [[ "${SHEAR}" != "success" ]] || \
             [[ "${DENY}" != "success" ]] || \
             [[ "${MSRV}" != "success" ]] || \
             [[ "${COVERAGE}" != "success" ]] || \
             [[ "${CHECK_EXTENSIONS}" != "success" ]] || \
             [[ "${WASM}" != "success" ]] || \
             [[ "${ACTION}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed"
