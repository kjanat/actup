name: autofix.ci
run-name: ${{ format('autofix {0}', github.ref_name) }}
# pretty-yaml-ignore: without space, github thinks the comma is the value
on: { pull_request: , push: { branches: [master] } }
permissions: { contents: read }
jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: tombi-toml/setup-tombi@be97456589cb1f9c6c8a419bd7fe825b40a9df50 # v1.8.5
      - uses: kjanat/install-dprint@c2cdca92154b44b2a2c15222d25d91d1cddfca1b # v2.2.0
      - uses: kjanat/install-shfmt@89fda398b6618b0c45c836832c3628abb81b87e6 # v1.0.0
      - name: Clippy fix
        run: cargo clippy --fix --allow-dirty --allow-staged --workspace --all-features
      - name: Format with dprint
        run: dprint fmt
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
