name: autofix.ci
run-name: ${{ format('autofix {0}', github.ref_name) }}
on: { pull_request:, push: { branches: [master] } }
permissions: { contents: read }
jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt,clippy" }
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - uses: tombi-toml/setup-tombi@v1
      - uses: kjanat/install-dprint@v1
      - uses: kjanat/install-shfmt@v1
      - name: Clippy fix
        run: cargo clippy --fix --allow-dirty --allow-staged --workspace --all-features
      - name: Format with dprint
        run: dprint fmt
      - uses: autofix-ci/action@v1
