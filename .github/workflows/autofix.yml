name: autofix.ci
run-name: ${{ format('autofix {0}', github.ref_name) }}
# without space, github thinks the comma is the value
# pretty-yaml-ignore
on: { pull_request: , push: { branches: [master] } }
permissions: { contents: read }
jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - parallel:
          - run: rustup toolchain install
          - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
          - uses: tombi-toml/setup-tombi@8ddc6b91b6fa3ad0ce192a68b409930851e4886c # v1.11.2
          - uses: kjanat/install-dprint@ad298f8bd07a6bf8dcb3bd13cd567a3e6a85af71 # v2.3.0
            with: { repository: kjanat/kprint, version: 0.60.6-kjanat }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - parallel:
          - name: Clippy fix
            run: cargo clippy --fix --allow-dirty --allow-staged --workspace --all-features
          - name: Format with dprint
            run: dprint fmt --allow-no-files --diff --excludes .github --fail-on-change
            continue-on-error: ${{ github.event.pull_request.stack == null }}
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
