[package]
name                   = "actup-provider-github"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "GitHub provider for actup - implements version resolution for GitHub.com and GitHub Enterprise"
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
publish.workspace      = true

[lib]
name = "actup_provider_github"
path = "src/lib.rs"

[dependencies]
actup-core      = { workspace = true }
actup-providers = { workspace = true }
base64          = { workspace = true }  # Base64 decoding for GitHub API content
futures         = { workspace = true }  # Async utilities (for parallel requests)
reqwest         = { workspace = true }  # HTTP client
serde           = { workspace = true }  # Serialization
serde_json      = { workspace = true }  # JSON parsing
tokio           = { workspace = true }  # Async runtime
tracing         = { workspace = true }  # Logging

[dev-dependencies]
wiremock = { workspace = true }

[lints]
workspace = true
