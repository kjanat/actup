[package]
name              = "actup-provider-github"
version.workspace = true
edition.workspace = true
description       = "GitHub provider for actup - implements version resolution for GitHub.com and GitHub Enterprise"
license.workspace = true

[dependencies]
actup-core = { path = "../core" }
# Base64 decoding for GitHub API content
base64     = { workspace = true }
# HTTP client
reqwest    = { workspace = true }
# Semver parsing
semver     = { workspace = true }
# GitHub API (optional, for more complex operations)
# octocrab = { workspace = true, optional = true }
# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }
# Error handling
thiserror  = { workspace = true }
# Async runtime
tokio      = { workspace = true }
# Logging
tracing    = { workspace = true }

[dev-dependencies]

[lints]
workspace = true

