[package]
name                   = "actup"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "CLI tool for managing GitHub Actions versions"
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
publish.workspace      = true

[[bin]]
name = "actup"
path = "src/main.rs"

[dependencies]
actup-core            = { workspace = true }  # Core engine
actup-provider-gitea  = { workspace = true, optional = true }  # Gitea/Forgejo provider
actup-provider-github = { workspace = true }  # GitHub provider
actup-provider-gitlab = { workspace = true, optional = true }  # GitLab provider
anstream              = { workspace = true }  # Colour-aware streams
clap                  = { workspace = true }  # CLI parsing
clap_complete         = { workspace = true }  # Shell completions
dirs                  = { workspace = true }  # Directory paths
indicatif             = { workspace = true }  # Progress spinner
itertools             = { workspace = true }  # Iterator utilities
owo-colors            = { workspace = true }  # Terminal colors
sanitize-filename     = { workspace = true }  # Safe filenames
schemars              = { workspace = true }  # JSON schema
serde                 = { workspace = true }  # Serialization
serde_json            = { workspace = true }  # JSON
tokio                 = { workspace = true }  # Async runtime
toml                  = { workspace = true }  # TOML serialization
tracing               = { workspace = true }  # Logging
tracing-subscriber    = { workspace = true }  # Log formatting

[dev-dependencies]
indicatif = { workspace = true, features = ["in_memory"] }  # Spinner rendering in tests
tempfile  = { workspace = true }  # Temp files for tests
wiremock  = { workspace = true }  # HTTP mocking

[features]
default = ["gitea", "github", "gitlab"]
gitea   = ["dep:actup-provider-gitea"]  # Gitea/Forgejo hosts
github  = []  # Placeholder for API symmetry; `actup-provider-github` is non-optional.
gitlab  = ["dep:actup-provider-gitlab"]  # GitLab hosts

[lints]
workspace = true
