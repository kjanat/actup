[package]
name                   = "actup-provider-gitea"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Gitea provider for actup - implements version resolution for Gitea and Forgejo instances"
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
publish.workspace      = true

[lib]
name = "actup_provider_gitea"
path = "src/lib.rs"

[dependencies]
actup-core      = { workspace = true }
actup-providers = { workspace = true }
base64          = { workspace = true }  # Base64 decoding for Gitea API content
reqwest         = { workspace = true }  # HTTP client
serde           = { workspace = true }  # Serialization
serde_json      = { workspace = true }  # JSON parsing
tokio           = { workspace = true }  # Async runtime
tracing         = { workspace = true }  # Logging

[dev-dependencies]
wiremock = { workspace = true }

[lints]
workspace = true
