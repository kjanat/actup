[package]
name                   = "actup-provider-gitlab"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "GitLab provider for actup - implements version resolution for GitLab.com and self-hosted GitLab"
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
publish.workspace      = true

[lib]
name = "actup_provider_gitlab"
path = "src/lib.rs"

[dependencies]
actup-core      = { workspace = true }
actup-providers = { workspace = true }
base64          = { workspace = true }  # Base64 decoding for GitLab API content
reqwest         = { workspace = true }  # HTTP client
serde           = { workspace = true }  # Serialization
serde_json      = { workspace = true }  # JSON parsing
tokio           = { workspace = true }  # Async runtime
tracing         = { workspace = true }  # Logging
urlencoding     = { workspace = true }  # URL encoding for project paths

[dev-dependencies]
wiremock = { workspace = true }

[lints]
workspace = true
