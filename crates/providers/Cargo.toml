[package]
name                   = "actup-providers"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Shared utilities for actup provider implementations"
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
publish.workspace      = true

[lib]
name = "actup_providers"
path = "src/lib.rs"

[dependencies]
actup-core    = { workspace = true }
bstr          = { workspace = true }
gix-features  = { workspace = true }
gix-protocol  = { workspace = true }
gix-transport = { workspace = true }
serde         = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }

[dev-dependencies]
gix-hash = { version = "0.25", features = ["sha1"] }

[lints]
workspace = true
