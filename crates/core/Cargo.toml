[package]
name                   = "actup-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Provider-neutral core engine for GitHub Actions version management"
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
publish.workspace      = true

[package.metadata.cargo-machete]
ignored = ["wasm-bindgen"]

[[example]]
name = "gen_simple_upper"
test = true

[dependencies]
clap          = { workspace = true, optional = true }  # gated by `clap` feature
dirs          = { workspace = true }  # Config discovery
figment       = { workspace = true }  # Configuration parsing
glob          = { workspace = true }  # File discovery (glob patterns)
json_comments = { workspace = true }  # JSONC parsing
saphyr-parser = { workspace = true }  # YAML parsing
schemars      = { workspace = true }  # Schema generation
serde         = { workspace = true }  # Serialization
strsim        = { workspace = true }  # Did-you-mean hints, closest-tag suggestions
thiserror     = { workspace = true }  # Error derive
tracing       = { workspace = true }  # Logging
tsify         = { workspace = true, optional = true }  # gated by `tsify` feature
wasm-bindgen  = { workspace = true, optional = true }  # required by tsify for `typescript_custom_section`

[dev-dependencies]
actup-test-support = { path = "../test-support" }
pulldown-cmark     = { workspace = true }
serde_json         = { workspace = true }
tempfile           = { workspace = true }
tokio              = { workspace = true }
toml               = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = { workspace = true }  # Disk cache entries
tokio      = { workspace = true }  # Full async runtime on native

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync"] }  # sync primitives only

[features]
# Clap helpers shared by the `actup` and `actup-mcp` binaries.
clap  = ["dep:clap"]
# Opt-in TypeScript binding generation via tsify. Enabled by `actup-wasm`
# for the npm package build (wasm32-unknown-unknown).
tsify = ["dep:tsify", "dep:wasm-bindgen"]

[lints]
workspace = true
