[package]
name                 = "actup-core"
version.workspace    = true
edition.workspace    = true
description          = "Provider-neutral core engine for GitHub Actions version management"
homepage.workspace   = true
repository.workspace = true
license.workspace    = true
publish.workspace    = true

[dependencies]
dirs          = { workspace = true }  # Config discovery
figment       = { workspace = true }  # Configuration parsing
glob          = { workspace = true }  # File discovery (glob patterns)
json_comments = { workspace = true }  # JSONC parsing
schemars      = { workspace = true }  # Schema generation
serde         = { workspace = true }  # Serialization

[dev-dependencies]
serde_json = { workspace = true }
tokio      = { workspace = true }
toml       = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }  # Async RwLock (native only; wasm32 uses std::sync::RwLock)

[lints]
workspace = true
