[package]
name                   = "actup-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Provider-neutral core engine for GitHub Actions version management"
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
publish.workspace      = true

[package.metadata.cargo-machete]
ignored = ["wasm-bindgen"]

[dependencies]
clap          = { workspace = true, optional = true }  # gated by `clap` feature
dirs          = { workspace = true }  # Config discovery
figment       = { workspace = true }  # Configuration parsing
glob          = { workspace = true }  # File discovery (glob patterns)
json_comments = { workspace = true }  # JSONC parsing
saphyr-parser = { workspace = true }  # YAML parsing
schemars      = { workspace = true }  # Schema generation
serde         = { workspace = true }  # Serialization
strsim        = { workspace = true }  # Did-you-mean hints, closest-tag suggestions
thiserror     = { workspace = true }  # Error derive
tracing       = { workspace = true }  # Logging
tsify-next    = { workspace = true, optional = true }  # gated by `tsify` feature
wasm-bindgen  = { workspace = true, optional = true }  # required by tsify-next for `typescript_custom_section`

[dev-dependencies]
serde_json = { workspace = true }
tempfile   = { workspace = true }
tokio      = { workspace = true }
toml       = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }  # Full async runtime on native

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync"] }  # sync primitives only

[features]
# Clap helpers shared by the `actup` and `actup-mcp` binaries.
clap  = ["dep:clap"]
# Opt-in TypeScript binding generation via tsify-next. Enabled by `actup-wasm`
# for the npm package build (wasm32-unknown-unknown). NOT enabled by the Zed
# extension (wasm32-wasip2) — wasm-bindgen's placeholder imports do not
# resolve under `wasm-component-ld`.
tsify = ["dep:tsify-next", "dep:wasm-bindgen"]

[lints]
workspace = true
