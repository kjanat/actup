[package]
name              = "actup-core"
version.workspace = true
edition.workspace = true
description       = "Provider-neutral core engine for GitHub Actions version management"
license.workspace = true
publish           = true

[dependencies]
# For config discovery
dirs          = { workspace = true }
# Configuration parsing
figment       = { workspace = true }
# For file discovery (glob patterns)
glob          = { workspace = true }
json_comments = { workspace = true }
# Schema generation
schemars      = { workspace = true }
# Serialization
serde         = { workspace = true }
# Async runtime (for RwLock)
tokio         = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
