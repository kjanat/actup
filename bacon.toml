#:schema https://dystroy.org/bacon/.bacon.schema.json
#:tombi schema.strict = false

# This is a configuration file for the bacon tool
#
# Complete help on configuration: https://dystroy.org/bacon/config/
#
# You may check the current default at
#   https://github.com/Canop/bacon/blob/main/defaults/default-bacon.toml

default_job          = "check-all"
env.CARGO_TERM_COLOR = "always"

[jobs.check]
command     = ["cargo", "check"]
need_stdout = false

[jobs.check-all]
command     = ["cargo", "check", "--all"]
need_stdout = false

[jobs.clippy]
command     = ["cargo", "clippy", "--all-targets", "--all-features"]
need_stdout = false

# Strict clippy matching CI requirements
[jobs.clippy-strict]
command     = ["cargo", "clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]
need_stdout = false

[jobs.test]
command     = ["cargo", "test", "--all"]
need_stdout = true

[jobs.nextest]
command     = ["cargo", "nextest", "run", "--all", "--hide-progress-bar", "--failure-output", "final"]
need_stdout = true
analyzer    = "nextest"

[jobs.doc]
command     = ["cargo", "doc", "--all", "--no-deps"]
need_stdout = false

[jobs.doc-open]
command     = ["cargo", "doc", "--all", "--no-deps", "--open"]
need_stdout = false
on_success  = "back"

# Run actup CLI (debug) - append args after --
[jobs.run]
command        = ["cargo", "run", "--bin", "actup", "--"]
need_stdout    = true
allow_warnings = true
background     = true

# Run actup on this repo (self-check)
[jobs.self-check]
command        = ["cargo", "run", "--release", "--package", "actup", "--", "check"]
need_stdout    = true
allow_warnings = true

# Check formatting with dprint
[jobs.fmt-check]
command     = ["dprint", "check"]
need_stdout = true

[keybindings]
c = "job:clippy"
d = "job:clippy-strict"
a = "job:check-all"
n = "job:nextest"
f = "job:fmt-check"
r = "job:run"
z = "job:self-check"
