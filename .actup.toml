#:schema schemas/actup-config.schema.json

default_host = "github.com"

[policy]
bump       = "latest"
pin        = "preserve"
track      = "keep"
branch     = "ignore"
prerelease = false

[scan]
ignore      = []
extra_paths = []

[cache]
ttl     = 86400
enabled = true

[fetch]
api_mode          = "graphql"
max_tags_per_repo = 100

