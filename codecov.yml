# yaml-language-server: $schema=https://www.schemastore.org/codecov.json
# Coverage configuration. Reference: https://docs.codecov.com/docs/codecovyml-reference
---
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

# Files excluded from both project and patch coverage.
# - Binary entrypoints (`fn main`) are exercised by integration tests, not unit tests.
# - `extensions/vscode` is TypeScript, outside the Cargo workspace.
ignore:
  - "**/main.rs"
  - "extensions/vscode/**"

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
