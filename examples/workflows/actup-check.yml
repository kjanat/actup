name: actup check
on:
  pull_request:
    paths: [".github/**", "action.yml", "action.yaml"]
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kjanat/actup@<release-sha> # v0.1.0
        with:
          version: v0.1.0
          command: check
          args: --strict
