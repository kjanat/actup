name: actup update
on:
  workflow_call:
    secrets:
      token:
        required: true
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kjanat/actup-v2@<release-sha> # v0.1.0
        with:
          version: v0.1.0
          command: update
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.token }}
          branch: actup/update
          commit-message: "ci: update GitHub Actions refs"
          title: "ci: update GitHub Actions refs"
          body: "`actup update` moved these `uses:` refs to newer versions."
