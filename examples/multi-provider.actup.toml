#:schema ../schemas/actup-config.schema.json
#
# Example configuration for github.com, a GitHub Enterprise host, GitLab.com
# and Codeberg.

default_host = "github.com"

[policy]
bump       = "minor"
pin        = "preserve"
track      = "keep"
branch     = "warn"
prerelease = false

# Pin every action from the enterprise host to a SHA
[[overrides]]
pattern = "github.enterprise.com/*/*"
policy  = { pin = "sha" }

[cache]
ttl     = 86400
enabled = true

[fetch]
api_mode          = "graphql"
max_tags_per_repo = 10

# Per-host configurations (keyed by hostname)

# GitHub Enterprise instance
[hosts."github.enterprise.com"]
kind      = "github"
api_base  = "https://github.enterprise.com/api/v3"
token_env = "GHE_TOKEN"

# GitLab.com and Codeberg (Forgejo) presets; both providers are REST-only
[hosts."gitlab.com"]
api_mode = "rest"

[hosts."codeberg.org"]
api_mode = "rest"

# Example workflow references this config would handle:
#
# GitHub.com:
#   - uses: actions/checkout@v4                    # default GitHub provider
#   - uses: github.com/actions/setup-node@v4       # explicit host
#
# GitHub Enterprise:
#   - uses: github.enterprise.com/internal/action@v1
#
# GitLab.com and Codeberg:
#   - uses: gitlab.com/group/project@v1
#   - uses: codeberg.org/owner/action@v1
